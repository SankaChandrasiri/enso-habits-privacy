<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B4BA8">
<title>Ensō Habits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600;700&display=swap">
<style>
/* Layout: one phone-width app column; white cards on a cool grey ground; bottom tab bar; floating "New habit" button above it. */
:root {
  --bg: #F3F4F9; --surface: #FFFFFF; --surface-2: #EEEFF6; --surface-3: #E3E5F0; --line: #DCDEEC;
  --ink: #161A30; --muted: #5A5E78; --primary: #3949AB; --on-primary: #FFFFFF;
  --primary-soft: #E0E4FF; --on-primary-soft: #11206E; --teal: #00897B; --gold: #D2931A; --warn: #8F600C;
  --danger: #B3261E; --scrim: rgba(12, 14, 34, .55); --shadow: 0 1px 2px rgba(22,26,48,.04), 0 4px 14px rgba(22,26,48,.035);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --r-lg: 24px; --r-md: 18px; --r-sm: 12px; --nav-h: 68px; --lift: 0%; --tint: 15%; --ease: cubic-bezier(.2, 0, 0, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1019; --surface: #181B28; --surface-2: #202433; --surface-3: #2A2E40; --line: #2E3246;
  --ink: #ECEDF8; --muted: #A2A6C0; --primary: #B4BEFF; --on-primary: #0B1A78;
  --primary-soft: #26338F; --on-primary-soft: #E1E5FF; --teal: #6ED5C5; --gold: #F2C46B; --warn: #F2C46B;
  --danger: #FFB4AB; --scrim: rgba(0,0,0,.6); --shadow: none; --lift: 45%; --tint: 24%; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1019; --surface: #181B28; --surface-2: #202433; --surface-3: #2A2E40; --line: #2E3246;
  --ink: #ECEDF8; --muted: #A2A6C0; --primary: #B4BEFF; --on-primary: #0B1A78;
  --primary-soft: #26338F; --on-primary-soft: #E1E5FF; --teal: #6ED5C5; --gold: #F2C46B; --warn: #F2C46B;
  --danger: #FFB4AB; --scrim: rgba(0,0,0,.6); --shadow: none; --lift: 45%; --tint: 24%; color-scheme: dark }

/* Theme colours chosen in Profile. light-dark() follows the active light or dark scheme. */
:root[data-accent="1"] { --primary: light-dark(#0F766E, #7FD6C9); --on-primary: light-dark(#FFFFFF, #00382F); --primary-soft: light-dark(#D3EFEA, #0B4F49); --on-primary-soft: light-dark(#06302C, #D3EFEA) }
:root[data-accent="2"] { --primary: light-dark(#3F7A45, #A3D6A0); --on-primary: light-dark(#FFFFFF, #0C3912); --primary-soft: light-dark(#DDEEDB, #24522A); --on-primary-soft: light-dark(#12301A, #DDEEDB) }
:root[data-accent="3"] { --primary: light-dark(#A8476A, #F2B3C6); --on-primary: light-dark(#FFFFFF, #4A1027); --primary-soft: light-dark(#F9DEE6, #6E2A44); --on-primary-soft: light-dark(#3D1022, #F9DEE6) }
:root[data-accent="4"] { --primary: light-dark(#8A6410, #EBC56F); --on-primary: light-dark(#FFFFFF, #3A2900); --primary-soft: light-dark(#F5E6BF, #5A4000); --on-primary-soft: light-dark(#2E2000, #F5E6BF) }
:root[data-accent="5"] { --primary: light-dark(#4B5B73, #B8C4D8); --on-primary: light-dark(#FFFFFF, #1C2636); --primary-soft: light-dark(#DEE4EE, #344054); --on-primary-soft: light-dark(#18212F, #DEE4EE) }

* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px }
h1, h2, h3 { margin: 0; text-wrap: balance }
p { margin: 0 }

.app { max-width: 460px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)) }
.app.nonav { padding-block-end: 120px }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 4px; padding-block: 12px 8px }
.topbar .t { flex: 1; min-width: 0 }
.topbar h1 { font-size: 18px; font-weight: 700 }
.page-h { padding-block: 22px 6px }
.page-h h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); flex: none }
.icon-btn:hover { background: var(--surface-2) }
.icon-btn svg { width: 22px; height: 22px }
.stack { display: flex; flex-direction: column; gap: 14px }
.row { display: flex; align-items: center; gap: 12px }
.grow { flex: 1; min-width: 0 }
.muted { color: var(--muted) }
.small { font-size: 13px }
.num { font-variant-numeric: tabular-nums }
.h3 { font-size: 15.5px; font-weight: 700 }

.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; border: 1px solid transparent }
.card.inset { background: var(--surface-2); box-shadow: none }
.card.soft { background: var(--primary-soft); color: var(--on-primary-soft); box-shadow: none }
.card.soft .muted { color: var(--on-primary-soft); opacity: .8 }
button.card { text-align: left; width: 100%; font: inherit; color: inherit }

.btn { border: 0; border-radius: 999px; padding: 0 20px; height: 46px; font-weight: 700; background: var(--primary); color: var(--on-primary); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s }
.btn:active { transform: scale(.98) }
.btn.tonal { background: var(--primary-soft); color: var(--on-primary-soft) }
.btn.outline { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1.5px var(--line) }
.btn.text { background: transparent; color: var(--primary); padding: 0 10px; height: 38px }
.btn.danger-text { background: transparent; color: var(--danger); padding: 0 10px; height: 38px }
.btn.block { width: 100% }
.btn svg { width: 18px; height: 18px }

/* Header + week strip */
.hello { display: flex; align-items: center; gap: 12px; padding-block: 22px 14px }
.hello h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2 }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--primary-soft); color: var(--on-primary-soft); font-weight: 800; display: grid; place-items: center; flex: none; font-size: 15px }
.avatar.lg { width: 60px; height: 60px; font-size: 21px }
.weekcard { padding: 10px 10px 16px }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px }
.prog { padding: 12px 8px 0; display: flex; flex-direction: column; gap: 8px }
.prog .bar-fill.full { background: var(--gold) }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 16px }
.wd.today { background: var(--primary-soft); color: var(--on-primary-soft) }
.wd .l { font-size: 11px; font-weight: 700; color: var(--muted) }
.wd.today .l { color: inherit }
.wd .r { position: relative; width: 34px; height: 34px; display: grid; place-items: center }
.wd .r svg { position: absolute; inset: 0; transform: rotate(-90deg) }
.wd .r circle { fill: none; stroke-width: 3.5 }
.wd .r .tr { stroke: var(--surface-3) }
.wd .r .br { stroke: var(--primary); stroke-linecap: round }
.wd .r .br.full { stroke: var(--gold) }
.wd .r b { font-size: 12.5px; font-weight: 700 }
.wd.fut .r b { color: var(--muted); font-weight: 500 }

.summary { display: flex; align-items: center; gap: 16px; padding: 4px }
.ring { width: 64px; height: 64px; flex: none; position: relative; display: grid; place-items: center }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg) }
.ring circle { fill: none; stroke-width: 7 }
.ring .track { stroke: var(--surface-3) }
.ring .bar { stroke: var(--primary); stroke-linecap: round }
.ring.full .bar { stroke: var(--gold) }
.ring b { font-size: 15px; font-weight: 800 }

/* Habit card */
.habit { cursor: pointer; transition: border-color .2s }
.habit:hover { border-color: var(--line) }
.habit .top { display: flex; align-items: center; gap: 14px }
.hicon { width: 46px; height: 46px; border-radius: 15px; flex: none; display: grid; place-items: center; background: color-mix(in oklab, var(--hc) var(--tint), transparent); color: color-mix(in oklab, var(--hc), white var(--lift)) }
.hicon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.hicon.lg { width: 58px; height: 58px; border-radius: 19px }
.hicon.lg svg { width: 30px; height: 30px }
.hicon.sm { width: 38px; height: 38px; border-radius: 12px }
.hicon.sm svg { width: 20px; height: 20px }
.habit .body { flex: 1; min-width: 0; transition: opacity .3s }
.habit.done .body { opacity: .62 }
.habit h3 { font-size: 16.5px; font-weight: 700 }
.habit .recipe { color: var(--muted); font-size: 13.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hc-text { color: color-mix(in oklab, var(--hc) 72%, var(--ink)) }
.meta { font-size: 12px; font-weight: 600; margin-top: 3px; color: var(--muted) }
.nudge { font-size: 12.5px; font-weight: 600; color: var(--warn); margin-top: 8px }
.chip { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); vertical-align: 2px; margin-left: 6px }
.fullv { border: 0; background: none; padding: 8px 0 0; color: var(--primary); font-weight: 700; font-size: 13px }

.steps-bar { display: flex; gap: 4px }
.steps-bar i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); transition: background .3s }
.steps-bar i.on { background: var(--hc) }
.steps-head { display: flex; align-items: center; gap: 10px; margin-top: 12px; border: 0; background: none; width: 100%; padding: 4px 0; text-align: left }
.steps-head svg { width: 20px; height: 20px; color: var(--muted); transition: transform .25s; flex: none }
.steps-head[aria-expanded="true"] svg { transform: rotate(180deg) }
.steps { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease }
.steps.open { grid-template-rows: 1fr }
.steps > div { overflow: hidden }
.step-row { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 9px 4px; border-radius: 12px; text-align: left; font-size: 15px }
.step-row:hover { background: var(--surface-2) }
.box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; transition: background .2s, border-color .2s }
.box svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .2s .05s }
.step-row.on .box { background: var(--hc); border-color: var(--hc) }
.step-row.on .box svg { stroke-dashoffset: 0 }
.step-row.on span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--muted) 50%, transparent) }

.check { width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; background: transparent; position: relative; flex: none; transition: transform .16s var(--ease) }
.check:active { transform: scale(.94) }
.check svg { width: 56px; height: 56px; overflow: visible; display: block }
.check .o { fill: none; stroke: var(--line); stroke-width: 3 }
.check.on .o { stroke: var(--hc) }
.check .f { fill: var(--hc); transform-origin: 28px 28px; transform: scale(0) }
.check.on .f { transform: scale(1) }
.check .tk { fill: none; stroke: #fff; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1 }
.check.on .tk { stroke-dashoffset: 0 }
.check.pop .f { animation: fill .28s var(--ease) both }
.check.pop .tk { animation: draw .22s .12s var(--ease) both }
.burst { position: absolute; inset: 0; pointer-events: none }
.burst i { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--hc); animation: fly .5s var(--ease) both }
.burst b { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--hc); animation: ripple .5s var(--ease) both }
.burst i:nth-child(even) { background: var(--gold) }
@keyframes fill { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@keyframes ripple { from { transform: scale(1); opacity: .45 } to { transform: scale(1.32); opacity: 0 } }
@keyframes draw { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
@keyframes fly { 0% { transform: translate(0,0); opacity: .8 } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0 } }

.banner { display: flex; gap: 12px; align-items: center }
.wd { border: 0; background: none; font: inherit; color: inherit }
button.wd:not(.fut):hover { background: var(--surface-2) }
button.wd.today:hover { background: var(--primary-soft) }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.daypick .pick { padding: 9px 0; text-align: center }
.tpl { display: flex; gap: 8px; flex-wrap: wrap }
.tpl .pick { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px }
.tpl .pick svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.day.rest:not(.l1):not(.l2) { opacity: .45 }
.toast { display: flex; align-items: center; gap: 12px }
.toast button { border: 0; background: none; color: inherit; font-weight: 800; text-decoration: underline; padding: 4px; margin-left: auto; flex: none }

.fab { position: fixed; z-index: 6; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); right: max(calc(16px + env(safe-area-inset-right, 0px)), calc((100vw - 460px) / 2 + 16px)); height: 56px; padding: 0 22px 0 18px; border-radius: 18px; border: 0; background: var(--primary); color: var(--on-primary); font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px color-mix(in oklab, var(--primary) 30%, transparent) }
.fab svg { width: 22px; height: 22px }

/* Bottom navigation */
.tabbar { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px) }
.tabbar > div { max-width: 460px; height: var(--nav-h); margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)) }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted) }
.tab .pill { width: 60px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .25s }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.tab.on { color: var(--primary) }
.task { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-radius: 12px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit }
.task + .task { border-top: 1px solid var(--line) }
.task .tbox { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--primary); display: grid; place-items: center; flex: none; background: none; color: var(--on-primary, #fff); padding: 0 }
.task .tbox svg { width: 16px; height: 16px; opacity: 0 }
.task .tbox.on { background: var(--primary) }
.task .tbox.on svg { opacity: 1 }
.task .tt { font-weight: 650 }
.task.done .tt { text-decoration: line-through; color: var(--muted) }
.task .play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--primary-soft); color: var(--on-primary-soft); display: grid; place-items: center; flex: none }
.task .play svg { width: 18px; height: 18px }
.mv { display: flex; align-items: center; gap: 6px; padding-top: 8px }
.ring-big { position: relative; width: 240px; height: 240px; margin: 8px auto }
.ring-big svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring-big circle { fill: none; stroke-width: 14 }
.ring-big .tr { stroke: var(--surface-2) }
.ring-big .fg { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset .9s linear }
.ring-big.brk .fg { stroke: var(--teal) }
.ring-big .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center }
.ring-big .lbl b { font-size: 48px; font-weight: 300; font-variant-numeric: tabular-nums }
.plan-step { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; margin-bottom: 4px }
.plan-step i { font-style: normal; color: var(--primary) }
.tab svg { transition: transform .28s var(--ease) }
.tab.on svg { transform: scale(1.34) }
.tab .pill { transition: background .25s, width .28s var(--ease), height .28s var(--ease) }
.tab.on .pill { width: 68px; height: 36px; border-radius: 18px }
.screen.from-right { animation: slideR .28s var(--ease) }
.screen.from-left { animation: slideL .28s var(--ease) }
@keyframes slideR { from { opacity: 0; transform: translateX(28px) } to { opacity: 1; transform: none } }
@keyframes slideL { from { opacity: 0; transform: translateX(-28px) } to { opacity: 1; transform: none } }
.tree-box { border-radius: var(--r-md); overflow: hidden }
.tree-box canvas { display: block; width: 100%; height: auto; aspect-ratio: 360 / 300 }
.swatch { display: inline-flex; align-items: center; gap: 7px }
.swatch i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12) }
.tab.on .pill { background: var(--primary-soft); color: var(--on-primary-soft) }

.toast { position: fixed; z-index: 30; left: 50%; bottom: calc(var(--nav-h) + 86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; animation: rise .25s ease-out }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px) } to { opacity: 1; transform: translate(-50%, 0) } }

.screen { animation: enter .24s var(--ease) }
@keyframes enter { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

.empty { text-align: center; padding: 28px 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px }
.empty h2 { font-size: 22px }

.enso .ring-p, .enso .tick-p { fill: none; stroke-linecap: round; stroke-linejoin: round }
.enso .ring-p { stroke: var(--primary) }
.enso .tick-p { stroke: var(--gold) }
.enso.drawin .ring-p { stroke-dasharray: 1; animation: drawr .9s .1s var(--ease) both }
.enso.drawin .tick-p { stroke-dasharray: 1; animation: drawr .28s .95s var(--ease) both }
@keyframes drawr { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted) }
.input, textarea.input { width: 100%; min-height: 50px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--surface); padding: 12px 14px; outline: none; transition: border-color .15s }
.input:focus { border-color: var(--primary) }
textarea.input { min-height: 84px; resize: vertical }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.pick { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; transition: background .15s, border-color .15s }
.pick.on { background: var(--primary-soft); border-color: transparent; color: var(--on-primary-soft) }
.icons { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px }
.ipick { border: 0; background: none; padding: 4px; border-radius: 18px; display: grid; place-items: center; box-shadow: inset 0 0 0 0 var(--hc); transition: box-shadow .15s }
.ipick.on { box-shadow: inset 0 0 0 2.5px var(--hc) }
.swatches { display: flex; gap: 12px; flex-wrap: wrap }
.accents { display: flex; gap: 14px; flex-wrap: wrap }
.accents button { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted) }
.accents i { width: 40px; height: 40px; border-radius: 50%; background: var(--c); transition: box-shadow .15s }
.accents button.on { color: var(--ink) }
.accents button.on i { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5.5px var(--ink) }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--c); transition: box-shadow .15s }
.sw.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5.5px var(--ink) }
.step-edit { display: flex; gap: 8px; align-items: center }
.dots { display: flex; align-items: center; gap: 6px }
.dots i { height: 8px; width: 8px; border-radius: 4px; background: var(--surface-3); transition: width .3s, background .3s }
.dots i.on { background: var(--primary) }

<script>
/* ---------------- Habit tree: one drawing function, driven only by progress f (0..1) ----------------
   Because the picture depends only on f, it runs forward on a check-in and backward on a missed day. */
const TREE = (() => {
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const smooth = t => t * t * (3 - 2 * t);
  const span = (x, a, b) => clamp((x - a) / (b - a));
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => {
    const p = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
    const x = p(a), y = p(b);
    return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")";
  };

  // Everything below can be changed.
  const SHAPES  = { Round: [1, 1], Tall: [.78, 1.2], Wide: [1.28, .86] };            // canopy stretch: across, up
  const LEAVES  = {                                                                   // back, middle, front
    Sage:   ["#6E9A68", "#86AE80", "#A6C89E"], Forest: ["#3F7A4C", "#559160", "#78B083"],
    Teal:   ["#3A8F82", "#56AC9F", "#80C8BD"], Autumn: ["#C9743F", "#DDA04A", "#EDC473"],
  };
  const FLOWERS = { Pink: "#F4A9C0", Cream: "#FFF3DC", Yellow: "#F6D86E", Lavender: "#C3ADEB" };
  const FRUITS  = { Apple: "#D9564C", Orange: "#F09C3C", Mango: "#F2C54D", Plum: "#8052A6" };
  const STAGES = [   // name, where it starts (share of the journey), where "jump" lands
    ["Seed", 0, 0], ["Sprout", .0001, .03], ["Sapling", .06, .1], ["Young tree", .2, .3],
    ["Mature tree", .45, .6], ["In bloom", .7, .82], ["Bearing fruit", .9, .95], ["Full harvest", 1, 1],
  ];
  // Canopy: soft round shapes. across, up(-)/down(+), radius (all as a share of canopy size), tone, when it appears.
  const BLOBS = [
    [-.56, .14, .50, 0, .24], [.56, .12, .52, 0, .30], [0, -.46, .60, 0, .36],
    [0, .02, .56, 1, .10], [-.30, -.14, .52, 1, .18], [.32, -.18, .50, 1, .22],
    [-.42, -.38, .32, 2, .42], [.24, -.54, .30, 2, .48], [.46, .02, .27, 2, .54], [-.12, .04, .28, 2, .46],
  ];
  // Where flowers (then fruit) sit, and the order they open in.
  const SPOTS = [[-.64, .12], [-.36, -.44], [-.04, -.74], [.3, -.56], [.64, -.04], [.38, .24], [-.02, .28], [-.38, .32], [-.2, -.12], [.14, -.24], [.56, -.36], [-.62, -.24]];
  const ORDER = [8, 2, 5, 0, 9, 4, 11, 6, 3, 7, 10, 1];

  const SKY = { calm: ["#E6F0F3", "#F5F8F1"], calmDark: ["#151A29", "#1D2533"], sunny: ["#8ED0F6", "#EAF7FF"] };
  const LAND = { calm: ["#DBE8D4", "#C7DCBD"], calmDark: ["#22302A", "#2A3A30"], sunny: ["#C2E6A8", "#9FD587"] };

  function stageOf(f) { let cur = STAGES[0]; for (const st of STAGES) if (f >= st[1]) cur = st; return cur; }

  /** Draws the whole scene into a W x H area. o = {shape, leaf, flower, fruit}. ripple: 0..1 or 0 for none. */
  function draw(ctx, W, H, f, o, dark, ripple) {
    f = clamp(f);
    const u = W / 360, GY = H - 48 * u, BX = W / 2;
    const s = Math.pow(clamp(f / .7), .65);                       // structure: trunk and canopy
    const bloom = span(f, .7, .9), fruit = span(f, .9, 1);
    const sun = smooth(span(f, .985, 1));                          // sunny sky once the goal is reached
    const g = smooth(s);
    const [sx, sy] = SHAPES[o.shape] || SHAPES.Round;
    const tones = LEAVES[o.leaf] || LEAVES.Sage;
    const circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); };
    const oval = (x, y, rx, ry, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, Math.PI * 2); ctx.fill(); };

    // Sky
    const sky = dark ? SKY.calmDark : SKY.calm, grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, mix(sky[0], SKY.sunny[0], sun)); grad.addColorStop(1, mix(sky[1], SKY.sunny[1], sun));
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    // Sun and two small clouds
    if (sun > 0) {
      const cx = W - 76 * u, cy = (64 + 26 * (1 - sun)) * u;
      ctx.fillStyle = "#FFE08A";
      ctx.globalAlpha = .16 * sun; circle(cx, cy, 58 * u);
      ctx.globalAlpha = .28 * sun; circle(cx, cy, 42 * u);
      ctx.globalAlpha = sun; ctx.fillStyle = "#FFD257"; circle(cx, cy, 27 * u);
      ctx.fillStyle = "#FFFFFF"; ctx.globalAlpha = .92 * sun;
      for (const [x, y, k] of [[66 - 18 * (1 - sun), 62, 1], [214 - 12 * (1 - sun), 34, .7]]) {
        circle(x * u, y * u, 13 * k * u); circle((x + 15 * k) * u, (y - 7 * k) * u, 16 * k * u); circle((x + 33 * k) * u, y * u, 12 * k * u);
        ctx.fillRect((x - 1 * k) * u, (y - 1 * k) * u, 35 * k * u, 13 * k * u);
        circle(x * u, (y + 6 * k) * u, 7 * k * u); circle((x + 33 * k) * u, (y + 6 * k) * u, 7 * k * u);
      }
      ctx.globalAlpha = 1;
    }

    // Camera: close to the ground while the plant is small, easing back as it grows
    const zoom = 1 + 1.5 * (1 - smooth(span(s, 0, .6)));
    ctx.save(); ctx.translate(BX, GY); ctx.scale(zoom, zoom); ctx.translate(-BX, -GY);

    // Land
    const land = dark ? LAND.calmDark : LAND.calm;
    ctx.fillStyle = mix(land[0], LAND.sunny[0], sun); oval(84 * u, GY + 34 * u, 210 * u, 48 * u);
    ctx.fillStyle = mix(land[1], LAND.sunny[1], sun); oval(BX + 20 * u, GY + 62 * u, 310 * u, 68 * u);
    ctx.fillStyle = mix(dark ? "#55463A" : "#B79F82", "#B79F82", sun); oval(BX, GY + 1 * u, (24 + 12 * g) * u, 5 * u);

    // One soft ring at the base on a check-in
    if (ripple > 0 && ripple < 1) {
      ctx.strokeStyle = dark ? "#FFFFFF" : "#4E6B4A"; ctx.globalAlpha = .4 * (1 - ripple); ctx.lineWidth = 2 * u;
      ctx.beginPath(); ctx.ellipse(BX, GY + 1 * u, (26 + 34 * easeOut(ripple)) * u, (5 + 7 * easeOut(ripple)) * u, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Seed
    const seedA = 1 - smooth(span(s, .03, .12));
    if (seedA > 0) { ctx.globalAlpha = seedA; ctx.fillStyle = dark ? "#B08C68" : "#8A6A4C"; oval(BX, GY - 2 * u, 7 * u, 5 * u, -.3); ctx.globalAlpha = 1; }

    // Trunk: one tapered shape
    const TH = (14 * easeOut(span(s, .01, .1)) + 136 * g) * u;
    const wb = (2.4 + 15 * g) * u, wt = wb * .5, tx = BX + 5 * g * u, ty = GY - TH;
    const bark = mix("#7DB56B", dark ? "#A88566" : "#8A6748", smooth(span(s, .08, .3)));
    if (TH > 0) {
      ctx.fillStyle = bark; ctx.beginPath();
      ctx.moveTo(BX - wb * .5 - 3 * g * u, GY + 1 * u);
      ctx.quadraticCurveTo(BX - wb * .42, GY - TH * .45, tx - wt * .5, ty);
      ctx.lineTo(tx + wt * .5, ty);
      ctx.quadraticCurveTo(BX + wb * .42, GY - TH * .45, BX + wb * .5 + 3 * g * u, GY + 1 * u);
      ctx.closePath(); ctx.fill();
    }

    // Canopy geometry
    const R = 84 * (.25 + .75 * g) * u, cx = tx, cy = ty - R * .25;
    const px = dx => cx + dx * sx * R, py = dy => cy + dy * sy * R;

    // Two branches reaching into the canopy
    const bk = easeOut(span(s, .25, .55));
    if (bk > 0) {
      ctx.strokeStyle = bark; ctx.lineCap = "round"; ctx.lineWidth = (1.5 + 5 * g) * bk * u;
      for (const [h, dx, dy] of [[.56, -.5, .22], [.7, .48, .16]]) {
        const x0 = lerp(BX, tx, h), y0 = GY - TH * h, x1 = lerp(x0, px(dx), bk), y1 = lerp(y0, py(dy), bk);
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(lerp(x0, x1, .5), y0 - 2 * u, x1, y1); ctx.stroke();
      }
    }

    // The first two leaves of the sprout, which make way for the canopy
    const sl = easeOut(span(s, .01, .07)) * (1 - smooth(span(s, .12, .26)));
    if (sl > 0) { ctx.fillStyle = tones[1]; for (const r of [-1, 1]) oval(tx + r * 7 * sl * u, ty - 4 * sl * u, 9 * sl * u, 4.6 * sl * u, r * -.6); }

    // Canopy, back to front
    for (const [dx, dy, r, tone, birth] of BLOBS) {
      const k = easeOut(span(s, birth, birth + .3));
      if (k <= 0) continue;
      ctx.fillStyle = tones[tone];
      oval(lerp(cx, px(dx), k), lerp(cy + R * .15, py(dy), k), r * R * k * (.5 + .5 * sx), r * R * k * (.5 + .5 * sy));
    }

    // Flowers open one by one, then each becomes a fruit
    const fc = FLOWERS[o.flower] || FLOWERS.Pink, fr = FRUITS[o.fruit] || FRUITS.Apple, n = SPOTS.length;
    ORDER.forEach((spot, i) => {
      const order = i / n, x = px(SPOTS[spot][0]), y = py(SPOTS[spot][1]);
      const open = easeOut(span(bloom, order * .75, order * .75 + .25));
      const ripe = smooth(span(fruit, order * .6, order * .6 + .4));
      const fs = open * (1 - ripe) * u;
      if (fs > .02 * u) {
        ctx.fillStyle = fc;
        for (let p = 0; p < 5; p++) { const a = p * Math.PI * 2 / 5 - Math.PI / 2; circle(x + Math.cos(a) * 4.4 * fs, y + Math.sin(a) * 4.4 * fs, 3.8 * fs); }
        ctx.fillStyle = "#EDBB45"; circle(x, y, 2.4 * fs);
      }
      if (ripe > .02) {
        const rr = 7.5 * ripe * u;
        ctx.fillStyle = fr; circle(x, y + 2 * ripe * u, rr);
        ctx.fillStyle = "rgba(255,255,255,.38)"; circle(x - rr * .32, y + 2 * ripe * u - rr * .32, rr * .27);
      }
    });
    ctx.restore();
  }
  return { draw, stageOf, SHAPES, LEAVES, FLOWERS, FRUITS, STAGES };
})();

/* ===================== Dates & stats (same maths as Stats.kt) ===================== */
const todayEpoch = () => { const d = new Date(); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
const dateOf = day => new Date(day * 864e5);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const WDAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const fmtShort = day => { const d = dateOf(day); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const wdi = day => (dateOf(day).getUTCDay() + 6) % 7;      // 0 = Monday
const mondayOf = day => day - wdi(day);

const S = {
  level: (h, day) => +(h.log[day] || 0),
  done: (h, day) => S.level(h, day) > 0,
  // Weekly target (perWeek > 0): any days count; only a finished week that falls short has misses (its last undone days).
  scheduled: (h, day, t = todayEpoch()) => {
    if (!(h.perWeek > 0)) return !h.days.length || h.days.includes(wdi(day));
    if (S.done(h, day)) return true;
    const m = mondayOf(day), dn = S.weekDone(h, m);
    if (m + 6 >= t) return day >= t && dn < h.perWeek;
    const short = h.perWeek - dn; if (short <= 0) return false;
    const miss = []; for (let d = m + 6; d >= m && miss.length < short; d--) if (d >= h.createdDay && !S.done(h, d)) miss.push(d);
    return miss.includes(day);
  },
  weekDone: (h, m) => { let c = 0; for (let i = 0; i < 7; i++) if (S.done(h, m + i)) c++; return c; },
  weekMet: (h, t) => h.perWeek > 0 && S.weekDone(h, mondayOf(t)) >= h.perWeek,
  inLast: (h, n, t) => { let c = 0; for (let i = 0; i < n; i++) if (S.done(h, t - i)) c++; return Math.min(c, S.window(h, n, t)); },
  window: (h, n, t) => { const span = Math.min(n, t - h.createdDay + 1); let c = 0; for (let i = 0; i < span; i++) if (S.scheduled(h, t - i)) c++; return Math.max(1, c); },
  total: h => Object.values(h.log).filter(v => v > 0).length,
  // Tree steps: +1 for a day done, -1 for a planned day missed (never below zero, never above the goal).
  growth: (h, t, back, goal) => { const ds = Object.keys(h.log).map(Number); const from = Math.min(h.createdDay, ...ds), to = h.graduatedDay != null ? Math.min(t, h.graduatedDay) : t; let g = 0; for (let d = from; d <= to; d++) { if (S.done(h, d)) g = Math.min(goal, g + 1); else if (back && d < t && d >= h.createdDay && S.scheduled(h, d)) g = Math.max(0, g - 1); } return g; },
  run: (h, t) => { let d = S.done(h, t) ? t : t - 1, n = 0; while (d >= h.createdDay - 400) { if (S.done(h, d)) n++; else if (S.scheduled(h, d) || d < h.createdDay) break; d--; } return n; },
  best: h => { const ds = Object.keys(h.log).filter(k => h.log[k] > 0).map(Number).sort((a, b) => a - b); let b = 0, r = 0, p = null; for (const d of ds) { let ok = p !== null && d - p <= 7; if (ok) for (let x = p + 1; x < d; x++) if (S.scheduled(h, x)) { ok = false; break; } r = ok ? r + 1 : 1; b = Math.max(b, r); p = d; } return b; },
  prevScheduled: (h, day) => { for (let i = 1; i <= 7; i++) if (S.scheduled(h, day - i)) return day - i >= h.createdDay ? day - i : null; return null; },
  missTwice: (h, t) => { if (h.graduatedDay != null || !S.scheduled(h, t) || S.done(h, t)) return false; const p = S.prevScheduled(h, t); return p != null && !S.done(h, p); },
  missedRow: (h, t) => { let n = 0; for (let d = t - 1; d >= h.createdDay && n < 60; d--) { if (S.done(h, d)) break; if (S.scheduled(h, d)) n++; } return n; },
  daysLabel: h => h.perWeek > 0 ? (h.perWeek === 1 ? "Once a week, any day" : `${h.perWeek} times a week, any days`) : !h.days.length ? "Every day" : h.days.join() === "0,1,2,3,4" ? "Weekdays" : h.days.join() === "5,6" ? "Weekends" : h.days.map(i => WDAYS[i].slice(0, 3)).join(" · "),
  rank: n => CFG.ranks.filter(r => n >= r[0]).pop(),
  next: n => CFG.ranks.find(r => r[0] > n),
  rankProg: n => { const c = S.rank(n), x = S.next(n); return x ? (n - c[0]) / (x[0] - c[0]) : 1; },
  recipe: h => { const steps = h.subtasks.filter(s => s.title.trim()).length; return `${h.anchor || "After …"}, I will ${h.tinyVersion || (steps ? `do my ${steps} steps` : "…")}${h.place ? " " + h.place : ""}.`; },
  latestStrength: h => h.strength.slice().sort((a, b) => b.day - a.day)[0],
  strengthDue: (h, t) => h.graduatedDay == null && t - h.createdDay >= 6 && (!S.latestStrength(h) || t - S.latestStrength(h).day >= 7),
  ready: h => { const l = h.strength.slice().sort((a, b) => a.day - b.day).slice(-3); return l.length === 3 && l.every(e => e.score >= CFG.graduateScore); },
  reviewDue: (d, t) => d.habits.some(h => h.graduatedDay == null && t - h.createdDay >= 6) && (d.settings.lastReviewDay == null || t - d.settings.lastReviewDay >= 7),
  strengthScore: a => Math.max(0, Math.min(100, Math.floor((a.reduce((x, y) => x + y, 0) - a.length) / (a.length * 4) * 100))),
  // sub-tasks
  stepsDone: (h, day) => !h.subtasks.length ? 0 : S.done(h, day) ? h.subtasks.length : h.subtasks.filter(s => (h.subLog[day] || []).includes(s.id)).length,
  stepOn: (h, day, id) => S.done(h, day) || (h.subLog[day] || []).includes(id),
  // insights
  activeOn: (h, day) => day >= h.createdDay && (h.graduatedDay == null || day < h.graduatedDay) && S.scheduled(h, day),
  dayRate: (hs, day) => { const r = hs.filter(h => S.activeOn(h, day)); return r.length ? r.filter(h => S.done(h, day)).length / r.length : null; },
  weekly: (hs, weeks, t) => { const m = mondayOf(t), out = []; for (let w = weeks - 1; w >= 0; w--) { const s = m - 7 * w; let dn = 0, p = 0; for (let d = s; d <= Math.min(s + 6, t); d++) for (const h of hs) if (S.activeOn(h, d)) { p++; if (S.done(h, d)) dn++; } out.push(p ? dn / p : null); } return out; },
  byWeekday: (hs, weeks, t) => { const dn = Array(7).fill(0), p = Array(7).fill(0); for (let d = t - 7 * weeks + 1; d <= t; d++) { const i = wdi(d); for (const h of hs) if (S.activeOn(h, d)) { p[i]++; if (S.done(h, d)) dn[i]++; } } return p.map((x, i) => x ? dn[i] / x : null); },
  checkIns: hs => hs.reduce((a, h) => a + S.total(h), 0),
};

const PCFG = { maxTasks: 3, eveningFrom: 17, minTimed: 3, estimates: [15, 30, 45, 60, 90, 120], focus: [25, 50, 90], breaks: [5, 10] };
const P = {
  tasksFor: (d, day) => d.tasks.filter(x => x.day === day && !x.letGo).sort((a, b) => (a.time < 0) - (b.time < 0) || a.time - b.time),
  leftovers: (d, t) => d.tasks.filter(x => x.day < t && !x.done && !x.letGo).sort((a, b) => a.day - b.day),
  timed: (d, t) => d.tasks.filter(x => x.estimate > 0 && x.actual > 0 && x.done && x.day > t - 28),
  ratio: (d, t) => { const a = P.timed(d, t); if (a.length < PCFG.minTimed) return null; return a.reduce((s, x) => s + x.actual, 0) / a.reduce((s, x) => s + x.estimate, 0); },
  realistic: (m, r) => r == null || m <= 0 ? m : Math.max(1, Math.round(m * r / 5)) * 5,
  mins: m => m < 60 ? `${m} min` : m % 60 === 0 ? `${m / 60} h` : `${Math.floor(m / 60)} h ${m % 60} min`,
  ratioLabel: r => r.toFixed(1) + "×",
  time: m => { const h = Math.floor(m / 60), mm = m % 60; return `${h % 12 || 12}:${String(mm).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; },
  sentence: x => `${x.time >= 0 ? "At " + P.time(x.time) : "Today"}${x.place.trim() ? " " + x.place.trim() : ""}, I will ${(x.title.trim().charAt(0).toLowerCase() + x.title.trim().slice(1)) || "…"}.`,
  meta: x => [x.time >= 0 ? P.time(x.time) : null, x.place || null, x.estimate > 0 ? P.mins(x.estimate) : null, x.actual > 0 ? P.mins(x.actual) + " focused" : null].filter(Boolean).join(" · ") || "Any time",
  eveningDue: (d, t) => new Date().getHours() >= PCFG.eveningFrom && d.settings.closedDay !== t,
  wins: (d, from, to) => d.wins.filter(w => w.day >= from && w.day <= to).sort((a, b) => b.day - a.day),
  dayName: (day, t) => day === t ? "Today" : day === t + 1 ? "Tomorrow" : day === t - 1 ? "Yesterday" : `${WDAYS[wdi(day)].slice(0, 3)} ${dateOf(day).getUTCDate()} ${MONTHS[dateOf(day).getUTCMonth()]}`,
};
const blankTask = day => ({ id: uid(), title: "", day, time: -1, place: "", estimate: 0, actual: 0, done: false, letGo: false, reminder: true });

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
const blankHabit = (i = 0) => ({ id: uid(), name: "", identity: "", anchor: "", tinyVersion: "", fullVersion: "", place: "", obstacle: "", backup: "", colorIndex: i % CFG.colors.length, reminderOn: false, reminderHour: 8, reminderMinute: 0, createdDay: todayEpoch(), log: {}, strength: [], graduatedDay: null, icon: "spark", subtasks: [], subLog: {}, days: [], perWeek: 0 });
const defaultSettings = () => ({ userName: "", focusLimit: CFG.focusLimit, celebration: 1, haptics: true, taperReminders: true, dynamicColor: false, themeMode: 0, accent: 0, treeGoal: 1000, treeShape: "Round", treeLeaf: "Sage", treeFlower: "Pink", treeFruit: "Apple", treeBack: true, planReminderOn: false, planHour: 20, planMinute: 30, focusMinutes: 25, breakMinutes: 5, closedDay: null, lastReviewDay: null, onboarded: true });

function sampleData() {

  morning.subLog[t] = [ids[0]];

    estimate: num(x.estimate, 0, 0, 1440), actual: num(x.actual, 0, 0, 1440), done: !!x.done, letGo: !!x.letGo, reminder: x.reminder !== false, sample: !!x.sample }));

const me = { name: "", signedIn: false };
let data = null;

function readLocal() { try { const t = localStorage.getItem(LOCAL_KEY); return t ? JSON.parse(t) : null; } catch { return null; } }
function writeLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(toExport(data))); } catch {} }
function setStatus(s) { store.status = s; const el = document.getElementById("sync"); if (el) el.textContent = s; }

async function flush() {
  if (!store.ref) return;
  if (store.writing) { store.again = true; return; }
  store.writing = true;
  try { await store.ref.set({ json: JSON.stringify(toExport(data)), savedAt: Date.now() }); setStatus("Saved to your account"); }
  catch (e) { setStatus(e && e.code === "quota_exceeded" ? "Your data is too large to save. Export a backup and remove old habits." : "Couldn't save just now. Changes are kept in this browser."); }
  store.writing = false;
  if (store.again) { store.again = false; flush(); }
}
function save() { writeLocal(); clearTimeout(store.timer); store.timer = setTimeout(flush, 700); }

async function connect() {
  if (!window.claude || !window.claude.use) return;
  const timeout = new Promise(r => setTimeout(() => r(null), 10000));
  try {
    const [db, user] = await Promise.all([Promise.race([claude.use("db"), timeout]), Promise.race([claude.use("user"), timeout])]);
    if (user) { try { const v = await user.me(); if (v && v.name) { me.name = v.name; } } catch {} }
    if (!db || !user) { render(); return; }
    const id = await user.id();
    if (!id) { render(); return; }
    me.signedIn = true;
    const ref = db.doc("data/users/" + id + "/state");
    const snap = await Promise.race([ref.get(), timeout]);
    if (!snap) { setStatus("Your account can't be reached yet. Changes are kept in this browser."); render(); return; }
    store.ref = ref; store.mode = "db";
    if (snap.exists) { try { data = normalize(JSON.parse(snap.data().json)); applyTheme(); tick(); } catch {} }
    else if (readLocal()) flush();
    store.status = "Saved to your account";
    render();
  } catch { render(); }
}

/* ===================== UI state ===================== */
const TABS = [["today", "Today", I.today], ["insights", "Insights", I.insights], ["way", "The Way", I.way], ["profile", "Profile", I.profile]];
let ui = { tab: "today", stack: [], step: 0, draft: null, isNew: false, err: "", justDone: null, modal: null, toast: null, celebrate: null, importText: "", open: {}, day: null };
const route = () => ui.stack.length ? ui.stack[ui.stack.length - 1] : { r: ui.tab };
let toastTimer = null;
const hostTheme = document.documentElement.getAttribute("data-theme");
function applyTheme() {
  const m = data.settings.themeMode, r = document.documentElement;
  if (m === 1) r.setAttribute("data-theme", "light"); else if (m === 2) r.setAttribute("data-theme", "dark");
  else if (hostTheme) r.setAttribute("data-theme", hostTheme); else r.removeAttribute("data-theme");
  r.setAttribute("data-accent", String((+data.settings.accent || 0) % CFG.accents.length));
}
function push(r) { ui.stack.push(r); ui.err = ""; render(); window.scrollTo(0, 0); }
function pop() { ui.stack.pop(); ui.err = ""; render(); window.scrollTo(0, 0); }
function goTab(t) { const a = TABS.findIndex(x => x[0] === ui.tab), b = TABS.findIndex(x => x[0] === t); ui.slide = b > a ? "right" : b < a ? "left" : null; ui.tab = t; ui.stack = []; render(); window.scrollTo(0, 0); }
// Swipe left or right anywhere on a main screen to move between the four sections.
let swipe = null;
document.addEventListener("touchstart", e => { const t = e.touches[0]; swipe = e.touches.length === 1 && !ui.stack.length && !ui.modal && !ui.celebrate && !e.target.closest("input, textarea, .heat, .scroll-x") ? { x: t.clientX, y: t.clientY } : null; }, { passive: true });
document.addEventListener("touchend", e => {
  if (!swipe) return; const t = e.changedTouches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y; swipe = null;
  if (Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  const i = TABS.findIndex(x => x[0] === ui.tab) + (dx < 0 ? 1 : -1);
  if (i >= 0 && i < TABS.length) goTab(TABS[i][0]);
}, { passive: true });
let toastUndo = null;
function toast(msg, undo) { ui.toast = msg; toastUndo = undo || null; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { ui.toast = null; toastUndo = null; render(); }, undo ? 4500 : 3200); }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const habit = id => data.habits.find(h => h.id === id);
const color = i => CFG.colors[((i % CFG.colors.length) + CFG.colors.length) % CFG.colors.length];
const motionOK = () => !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const initials = () => { const n = displayName(); return n ? n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("") : "E"; };
const bar = (title, right) => `<header class="topbar"><button class="icon-btn" data-act="back" aria-label="Back">${I.back}</button><div class="t"><h1>${title}</h1></div>${right || ""}</header>`;

/* ===================== Charts ===================== */
function ringSvg(cls, frac, r, sw, size) {
  const C = 2 * Math.PI * r;
  return `<svg viewBox="0 0 ${size} ${size}"><circle class="tr" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${sw}"/>${frac > 0 ? `<circle class="br ${cls}" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${sw}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.min(1, frac))}"/>` : ""}</svg>`;
}
/** GitHub-style heatmap, Monday on top, `weeks` columns ending with this week. */
function heatmap(weeks, end, val, col) {
  const cell = 15, gap = 3, L = 18, T = 16, W = L + weeks * (cell + gap) - gap, H = T + 7 * (cell + gap) - gap;
  const start = mondayOf(end) - 7 * (weeks - 1);
  let out = "", lastM = -1;
  [[0, "M"], [2, "W"], [4, "F"]].forEach(([r, l]) => { out += `<text x="0" y="${T + r * (cell + gap) + 11}">${l}</text>`; });
  for (let w = 0; w < weeks; w++) {
    const mon = start + 7 * w, m = dateOf(mon).getUTCMonth(), x = L + w * (cell + gap);
    if (m !== lastM) { if (w > 0 || weeks <= 8) out += `<text x="${x}" y="10">${MONTHS[m]}</text>`; lastM = m; }
    for (let d = 0; d < 7; d++) {
      const day = mon + d, y = T + d * (cell + gap), v = day > end ? null : val(day);
      const fill = v == null ? "var(--surface-2)" : v <= 0 ? "var(--surface-3)" : `color-mix(in oklab, ${col} ${Math.round(30 + 70 * Math.min(1, v))}%, var(--surface))`;
      out += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3.5" fill="${fill}"${day === end ? ' stroke="var(--ink)" stroke-width="1.6"' : ""}><title>${fmtShort(day)}${v == null ? "" : `: ${Math.round(v * 100)}%`}</title></rect>`;
    }
  }
  return `<svg class="hm" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heatmap of the last ${weeks} weeks">${out}</svg>
    <div class="legend" style="justify-content:flex-end;margin-top:8px">Less <i style="background:var(--surface-3)"></i><i style="background:color-mix(in oklab, ${col} 40%, var(--surface))"></i><i style="background:color-mix(in oklab, ${col} 70%, var(--surface))"></i><i style="background:${col}"></i> More</div>`;
}
/** Vertical bars of 0..1 rates with a label under each; `hi` gets full colour and its value printed. */
function rateBars(vals, labels, col, hi) {
  const W = 320, H = 150, L = 30, T = 16, B = 20, n = vals.length, slot = (W - L) / n, bw = slot * .56, h = H - T - B;
  let out = [0, .5, 1].map(f => `<line class="grid" x1="${L}" x2="${W}" y1="${T + h * (1 - f)}" y2="${T + h * (1 - f)}"/><text x="${L - 6}" y="${T + h * (1 - f) + 3.5}" text-anchor="end">${f * 100}%</text>`).join("");
  vals.forEach((v, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    if (v != null && v > 0) out += `<rect class="bar" style="animation-delay:${i * 40}ms" x="${x.toFixed(1)}" y="${(T + h * (1 - v)).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h * v).toFixed(1)}" rx="${(bw * .25).toFixed(1)}" fill="${col}" fill-opacity="${hi < 0 || i === hi ? 1 : .42}"><title>${labels[i]}: ${Math.round(v * 100)}%</title></rect>`;
    if (i === hi && v != null) out += `<text class="strong" x="${(x + bw / 2).toFixed(1)}" y="${(T + h * (1 - v) - 5).toFixed(1)}" text-anchor="middle">${Math.round(v * 100)}%</text>`;
    out += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${out}</svg>`;
}

/* ===================== Screens ===================== */
function greeting() { const h = new Date().getHours(); const p = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; const n = displayName().split(" ")[0]; return n ? `${p}, ${esc(n)}` : p; }

function viewToday() {
  const t = todayEpoch(), d = new Date();
  const mon = mondayOf(t);
  const day = ui.day != null && ui.day <= t && ui.day >= mon ? ui.day : t, isToday = day === t;
  const active = data.habits.filter(h => h.graduatedDay == null);
  const planned = active.filter(h => S.scheduled(h, day));
  const done = planned.filter(h => S.done(h, day)).length;
  const frac = planned.length ? done / planned.length : 0;
  let html = `<div class="hello"><div class="grow"><div class="eyebrow">${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}</div><h1>${greeting()}</h1></div><button class="avatar" data-act="tab" data-to="profile" aria-label="Profile">${esc(initials())}</button></div><main class="stack">`;
  html += `<div class="card weekcard"><div class="week" aria-label="This week. Tap a day to check in for it.">`;
  for (let i = 0; i < 7; i++) {
    const wd = mon + i, rate = wd > t ? null : S.dayRate(active, wd);
    html += `<button class="wd${wd === day ? " today" : ""}${wd > t ? " fut" : ""}" ${wd > t ? "disabled" : `data-act="pickday" data-d="${wd}"`} aria-pressed="${wd === day}" aria-label="${WDAYS[i]}${rate == null ? "" : `, ${Math.round(rate * 100)}% done`}"><span class="l">${WDAYS[i][0]}</span><span class="r">${ringSvg(rate >= 1 ? "full" : "", rate || 0, 15, 3.5, 34)}<b>${dateOf(wd).getUTCDate()}</b></span></button>`;
  }
  html += `</div>`;
  if (active.length) {
    const all = planned.length && done === planned.length;
    html += `<div class="prog"><div class="row" style="gap:8px"><b class="grow">${!planned.length ? "Rest day" : all ? (isToday ? "All done today" : "All done") : `${done} of ${planned.length} done${isToday ? " today" : ""}`}</b><span class="small muted">${!planned.length ? "Nothing planned" : all ? "Rest well" : "The tiny version counts"}</span></div><div class="bar-track"><div class="bar-fill${all ? " full" : ""}" style="width:${(frac * 100).toFixed(1)}%"></div></div></div>`;
  }
  html += `</div>`;
  if (!isToday) html += `<div class="row" style="padding:0 4px"><b class="grow">Checking in for ${day === t - 1 ? "yesterday" : `${WDAYS[wdi(day)]} ${dateOf(day).getUTCDate()} ${MONTHS[dateOf(day).getUTCMonth()]}`}</b><button class="btn text" data-act="pickday" data-d="${t}">Back to today</button></div>`;
  if (isToday) html += planCards(t);
  if (active.length) {
    if (active.every(h => S.total(h) === 0)) html += `<div class="card inset small muted">Tap the circle to check in. Tap a card to see its history and edit it.</div>`;
  }
  if (data.habits.some(h => h.sample)) html += `<div class="row small muted" style="padding:0 6px"><span class="grow">Sample habits, so you can look around.</span><button class="btn text" data-act="clear-samples">Start fresh</button></div>`;
  if (S.reviewDue(data, t)) html += `<button class="card soft" data-act="push" data-r="review"><b>Weekly review is ready</b><div class="muted small">Two minutes to see what worked and adjust a cue or size.</div></button>`;
  if (!active.length) html += `<div class="empty">${enso(124, true)}<h2>Start with one tiny habit</h2><p class="muted" style="max-width:32ch">Pick something you already do every day, then attach a two-minute action to it. Add steps if it's a routine.</p><button class="btn" data-act="new" style="margin-top:8px">Create my first habit</button></div>`;
  for (const h of active) html += habitCard(h, day, isToday);
  html += `<div class="sync" id="sync">${esc(store.status || (store.mode === "local" ? "Saved in this browser" : ""))}</div></main>`;
  if (active.length) html += `<button class="fab" data-act="new">${I.plus}New habit</button>`;
  return html;
}

/* ---------- Daily planning views ---------- */
const playIco = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>`;
const timerIco = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>`;
const taskRow = (x, focusable = true) => `<div class="task${x.done ? " done" : ""}"><button class="tbox${x.done ? " on" : ""}" data-act="task-toggle" data-t="${x.id}" role="checkbox" aria-checked="${x.done}" aria-label="${x.done ? "Undo" : "Done"}: ${esc(x.title)}">${I.tick}</button>
  <button class="grow" style="background:none;border:0;text-align:left;color:inherit;font:inherit;padding:0" data-act="task-open" data-t="${x.id}"><div class="tt">${esc(x.title)}</div><div class="small muted">${esc(P.meta(x))}</div></button>
  ${focusable && !x.done ? `<button class="play" data-act="task-focus" data-t="${x.id}" aria-label="${data.focus && data.focus.taskId === x.id ? "Focus session running" : "Start a focus session"}">${data.focus && data.focus.taskId === x.id ? timerIco : playIco}</button>` : ""}</div>`;
const moveRow = (x, t, target, label) => `<div class="mv"><div class="grow"><div style="font-weight:650">${esc(x.title)}</div><div class="small muted">${P.dayName(x.day, t)}</div></div><button class="btn text" data-act="task-move" data-t="${x.id}" data-d="${target}">${label}</button><button class="btn text" data-act="task-letgo" data-t="${x.id}">Let go</button></div>`;

function planCards(t) {
  let html = "";
  const left = P.leftovers(data, t);
  if (left.length) html += `<div class="card inset"><b>From earlier days</b><div class="small muted">Not finished, and that's fine. Move each to today, or let it go.</div>${left.map(x => moveRow(x, t, t, "Today")).join("")}</div>`;
  const tasks = P.tasksFor(data, t), dn = tasks.filter(x => x.done).length;
  html += `<div class="card"><div class="row"><b class="grow" style="color:var(--primary)">Today's top 3</b>${tasks.length ? `<span class="small muted">${dn} of ${tasks.length} done</span>` : ""}</div>`;
  if (!tasks.length) html += `<p class="small muted" style="margin:6px 0 10px">Pick up to three things that would make today a good day, each with a time and place.</p><button class="btn tonal" data-act="task-add" data-d="${t}">${I.plus}Add a task</button>`;
  else html += tasks.map(x => taskRow(x)).join("") + (tasks.length < PCFG.maxTasks ? `<button class="btn text" data-act="task-add" data-d="${t}" style="margin-top:4px">Add a task</button>` : `<div class="small muted" style="margin-top:6px">Three is enough. The rest of the day is room for surprises.</div>`);
  html += `</div>`;
  if (data.settings.closedDay === t) html += `<div class="card inset row"><div class="grow"><b>Workday closed</b><div class="small muted">Tomorrow is planned. You can switch off.</div></div><button class="btn text" data-act="push" data-r="plan">Open plan</button></div>`;
  else if (P.eveningDue(data, t)) html += `<button class="card soft" data-act="push" data-r="plan"><b>Plan tomorrow · 2 minutes</b><div class="muted small">Note today's win, sort what's unfinished and pick tomorrow's top 3. Once it's written down, your mind can rest.</div></button>`;
  return html;
}

function viewTask(rt) {
  const t = todayEpoch(), x = ui.tdraft, r = P.ratio(data, t), isNew = !data.tasks.some(y => y.id === x.id);

  if (x.day >= t) html += `<div class="chips">${[t, t + 1].map(d => `<button class="pick${x.day === d ? " on" : ""}" data-act="tday" data-d="${d}">${P.dayName(d, t)}</button>`).join("")}</div>`;
  html += `<label class="field"><span>What will you do?</span><input class="input" id="tk-title" data-tfield="title" maxlength="120" value="${esc(x.title)}" placeholder="Write the report introduction" autocomplete="off"></label>

    <label class="field"><span>Where? (optional)</span><input class="input" id="tk-place" data-tfield="place" maxlength="60" value="${esc(x.place)}" placeholder="at my desk" autocomplete="off"></label>
    <div class="field"><span>How long do you think it will take?</span><div class="chips"><button class="pick${!x.estimate ? " on" : ""}" data-act="test" data-v="0">Not sure</button>${PCFG.estimates.map(m => `<button class="pick${x.estimate === m ? " on" : ""}" data-act="test" data-v="${m}">${P.mins(m)}</button>`).join("")}</div>
      <p class="small muted">${r != null && x.estimate ? `Your timed tasks have taken ${P.ratioLabel(r)} your estimates, so allow about ${P.mins(P.realistic(x.estimate, r))}.` : r != null ? `Your timed tasks have taken ${P.ratioLabel(r)} your estimates.` : "Most people underestimate. Time a few tasks with Focus and the app will learn your own pace."}</p></div>
    <div class="card soft"><div class="small" style="font-weight:700">Your plan</div><div id="tk-pv" style="font-size:17px;font-weight:700;margin:2px 0 4px">${esc(P.sentence(x))}</div><div class="small muted">Plans that name a time and place are much more likely to happen.</div></div>

function viewFocus(rt) {
  const x = data.tasks.find(y => y.id === rt.id); if (!x) { setTimeout(pop); return ""; }
  const s = data.focus, running = s && s.taskId === x.id, now = Date.now(), onBreak = !running && ui.breakEnd > now;
  const C = 2 * Math.PI * 113;
  const ring = (frac, label, sub, brk) => `<div class="ring-big${brk ? " brk" : ""}"><svg viewBox="0 0 240 240"><circle class="tr" cx="120" cy="120" r="113"/><circle class="fg" cx="120" cy="120" r="113" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - Math.max(0, Math.min(1, frac)))).toFixed(1)}"/></svg><div class="lbl"><b id="fc-l">${label}</b><span class="small muted">${sub}</span></div></div>`;
  const clock = ms => { const q = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(q / 60)}:${String(q % 60).padStart(2, "0")}`; };
  let html = bar("Focus") + `<main class="stack" style="text-align:center"><h2 style="margin:0">${esc(x.title)}</h2><div class="small muted">${esc(P.meta(x))}</div>`;
  if (running) {
    const left = s.startMillis + s.minutes * 6e4 - now;
    html += ring(1 - left / (s.minutes * 6e4), clock(left), `of ${s.minutes} min`) + `<p class="muted small">One thing at a time. Each switch away costs time to get back into it. Silence notifications if you can.</p><button class="btn block" data-act="focus-stop">Stop and save the time</button>`;
  } else if (onBreak) {
    const left = ui.breakEnd - now;
    html += ring(1 - left / (data.settings.breakMinutes * 6e4), clock(left), "break", true) + `<p>Session saved. Stand up, look out of a window, have some water.</p><div class="row" style="justify-content:center;gap:10px"><button class="btn outline" data-act="break-skip">Skip break</button><button class="btn" data-act="focus-done">Task done</button></div>`;
  } else {
    const m = ui.focusLen || data.settings.focusMinutes, other = s && data.tasks.find(y => y.id === s.taskId);

      `<div class="chips" style="justify-content:center">${PCFG.focus.map(v => `<button class="pick${m === v ? " on" : ""}" data-act="focus-len" data-v="${v}">${v} min</button>`).join("")}</div>
      <button class="btn block" data-act="focus-start">Start focus</button><button class="btn text" data-act="focus-done">Mark task done</button>`;

}

/* ---------- Habit tree painting: eases toward the new step, forward or backward ---------- */
const treeShown = {};
let treeRaf = 0, treeLast = 0;
const darkNow = () => { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; };
function paintTrees(now) {
  const list = root.querySelectorAll("canvas.tree"); if (!list.length) { treeRaf = 0; return; }
  const dt = now && treeLast ? Math.min(.05, (now - treeLast) / 1000) : 0; treeLast = now || 0;
  const s = data.settings, o = { shape: s.treeShape, leaf: s.treeLeaf, flower: s.treeFlower, fruit: s.treeFruit }, dark = darkNow();
  let moving = false;
  list.forEach(cv => {
    const key = cv.dataset.key, target = +cv.dataset.f;
    let cur = treeShown[key]; if (cur == null) cur = Math.max(0, target - .05);
    cur = !motionOK() ? target : target + (cur - target) * Math.exp(-dt / .22);
    if (Math.abs(cur - target) < .0004) cur = target; else moving = true;
    treeShown[key] = cur;
    const d = Math.min(3, window.devicePixelRatio || 1), W = 360, H = 300;
    if (cv.width !== W * d) { cv.width = W * d; cv.height = H * d; }
    const ctx = cv.getContext("2d"); ctx.setTransform(d, 0, 0, d, 0, 0); TREE.draw(ctx, W, H, cur, o, dark, 0);
  });
  cancelAnimationFrame(treeRaf);
  treeRaf = moving ? requestAnimationFrame(paintTrees) : 0; if (!moving) treeLast = 0;
}

/* ---------- Focus timer ---------- */
function stopFocus() {
  const f = data.focus; if (!f) return;
  const spent = Math.max(0, Math.min(f.minutes, Math.floor((Date.now() - f.startMillis) / 6e4)));
  const x = data.tasks.find(y => y.id === f.taskId); if (x) x.actual += spent;
  data.focus = null; save();
}
let tickTimer = null;
function tick() {
  clearTimeout(tickTimer);
  const f = data.focus;
  if (f && Date.now() >= f.startMillis + f.minutes * 6e4) {   // session finished: save it and start the break
    const x = data.tasks.find(y => y.id === f.taskId); if (x) x.actual += f.minutes;
    data.focus = null; save();
    if (route().r === "focus") ui.breakEnd = Date.now() + data.settings.breakMinutes * 6e4;
    toast(`Focus session done. Take a ${data.settings.breakMinutes}-minute break.`);
  }

  if (onFocus) render();
  if (data.focus || (onFocus && ui.breakEnd > Date.now())) tickTimer = setTimeout(tick, 1000);
}

let confettiRun = 0;
function startConfetti() {
  const cv = document.getElementById("confetti"); if (!cv) return;
  const run = ++confettiRun;
  if (!motionOK() || data.settings.celebration !== 2) return;
  const ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; ctx.scale(dpr, dpr);
  const W = cv.clientWidth, H = cv.clientHeight, cols = ["#F2C46B", "#8C9EFF", "#6ED5C5", "#FFFFFF"];
  const ps = Array.from({ length: 70 }, (_, i) => ({ x: Math.random() * W, d: Math.random() * .35, v: .9 + Math.random() * .8, r: Math.random() * 360, c: cols[i % 4], w: 6 + Math.random() * 6 }));
  const t0 = performance.now();
  (function frame(now) {
    if (run !== confettiRun || !document.getElementById("confetti")) return;
    const p = Math.min(1, (now - t0) / 2800); ctx.clearRect(0, 0, W, H);
    for (const q of ps) { const y = (p * q.v - q.d) * H * 1.2 - 20; if (y < -20 || y > H) continue; const x = q.x + Math.sin(p * 8 + q.x) * 18; ctx.save(); ctx.translate(x, y); ctx.rotate((q.r + p * 540) * Math.PI / 180); ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.w / 4, q.w, q.w / 2); ctx.restore(); }
    if (p < 1) requestAnimationFrame(frame);
  })(t0);
}
let celebTimer = null;

  if (h.subtasks.length) { if (lvl > 0) h.subLog[day] = h.subtasks.map(s => s.id); else delete h.subLog[day]; }

    case "pw": ui.draft.perWeek = +el.dataset.v; if (ui.draft.perWeek) ui.draft.days = []; render(); break;
    case "task-add": ui.tdraft = blankTask(+el.dataset.d); push({ r: "task" }); setTimeout(() => { const i = document.getElementById("tk-title"); if (i) i.focus(); }); break;
    case "task-open": { const x = data.tasks.find(y => y.id === el.dataset.t); if (x) { ui.tdraft = Object.assign({}, x); push({ r: "task", id: x.id }); } break; }
    case "task-toggle": { const x = data.tasks.find(y => y.id === el.dataset.t); if (!x) break; x.done = !x.done; if (x.done) { buzz(); if (data.focus && data.focus.taskId === x.id) stopFocus(); } save(); render(); break; }
    case "task-focus": ui.focusLen = null; push({ r: "focus", id: el.dataset.t }); break;
    case "task-move": { const x = data.tasks.find(y => y.id === el.dataset.t); if (x) { x.day = +el.dataset.d; x.done = false; x.letGo = false; save(); render(); } break; }
    case "task-letgo": { const x = data.tasks.find(y => y.id === el.dataset.t); if (x) { x.letGo = true; save(); render(); } break; }
    case "tday": ui.tdraft.day = +el.dataset.d; render(); break;
    case "ttime-any": ui.tdraft.time = -1; render(); break;
    case "test": ui.tdraft.estimate = +el.dataset.v; render(); break;
    case "task-save": { const x = ui.tdraft; if (!x.title.trim()) break; x.title = x.title.trim(); x.place = x.place.trim(); const i = data.tasks.findIndex(y => y.id === x.id); if (i >= 0) data.tasks[i] = x; else data.tasks.push(x); save(); pop(); break; }
    case "task-del": openModal({ title: "Delete this task?", ok: "Delete", run: () => { const id = ui.tdraft.id; if (data.focus && data.focus.taskId === id) data.focus = null; data.tasks = data.tasks.filter(y => y.id !== id); save(); ui.stack.pop(); } }); break;
    case "focus-len": ui.focusLen = +el.dataset.v; render(); break;
    case "focus-start": { if (data.focus) stopFocus(); const m = ui.focusLen || data.settings.focusMinutes; data.focus = { taskId: route().id, startMillis: Date.now(), minutes: m }; data.settings.focusMinutes = m; ui.breakEnd = 0; save(); render(); tick(); break; }
    case "focus-stop": stopFocus(); render(); break;
    case "break-skip": ui.breakEnd = 0; render(); break;
    case "focus-done": { const x = data.tasks.find(y => y.id === route().id); if (x && !x.done) { if (data.focus && data.focus.taskId === x.id) stopFocus(); x.done = true; buzz(); save(); } ui.breakEnd = 0; pop(); break; }
    case "close-day": {
      const t2 = todayEpoch(), w = (ui.win || "").trim();
      data.wins = data.wins.filter(x => x.day !== t2); if (w) data.wins.unshift({ day: t2, text: w });
      for (const x of P.tasksFor(data, t2)) if (!x.done) x.day = t2 + 1;
      data.settings.closedDay = t2; ui.win = null; save(); pop();
      celebrate("Workday closed", "Tomorrow is planned", "It's written down, so you can let it go until tomorrow."); break;
    }
    case "back": pop(); break;
    case "open": if (e.target.closest(".check, .fullv, .steps-head, .step-row")) return; push({ r: "detail", id }); break;
    case "check": {
      const h = habit(id); if (!h) return;
      const dd = selDay();
      if (S.done(h, dd)) { setLog(h, dd, 0); render(); }
      else { buzz(); setLog(h, dd, 1); ui.justDone = id; toast(`${h.name} done`, () => { const x = habit(id); if (x) setLog(x, dd, 0); }); }
      break;
    }
    case "full": { const h = habit(id); buzz(); setLog(h, selDay(), 2); render(); break; }
    case "toggle-steps": ui.open[id] = !ui.open[id]; render(); break;
    case "step": { const h = habit(id), dd = route().r === "detail" ? t : selDay(); const wasOn = S.stepOn(h, dd, el.dataset.s); if (!wasOn) buzz(); if (toggleStep(h, dd, el.dataset.s)) ui.justDone = id; render(); break; }
    case "new": {
      const active = data.habits.filter(h => h.graduatedDay == null).length;
      if (active >= data.settings.focusLimit) { toast(`Focus on ${data.settings.focusLimit} habits at a time. Graduate one, or raise the limit in Profile.`); break; }
      ui.draft = blankHabit(data.habits.length); ui.step = 0; ui.isNew = true; push({ r: "edit" }); break;
    }
    case "clear-samples": data.tasks = data.tasks.filter(x => !x.sample); data.wins = data.wins.filter(x => !x.sample); data.habits = data.habits.filter(h => !h.sample); data.reviews = []; data.settings.lastReviewDay = null; save(); toast("Samples cleared. Create your first habit."); break;
    case "icon": ui.draft.icon = el.dataset.v; render(); break;
    case "anchor": ui.draft.anchor = el.dataset.v; ui.err = ""; render(); break;
    case "color": ui.draft.colorIndex = +el.dataset.i; render(); break;
    case "rem": ui.draft.reminderOn = !ui.draft.reminderOn; render(); break;
    case "add-step": { const st = { id: uid(), title: "" }; ui.draft.subtasks.push(st); render(); const inp = document.getElementById("st-" + st.id); if (inp) inp.focus(); break; }
    case "del-step": ui.draft.subtasks = ui.draft.subtasks.filter(s => s.id !== el.dataset.s); render(); break;
    case "wprev": if (ui.step > 0) { ui.step--; ui.err = ""; render(); } else pop(); break;
    case "wsave": case "wnext": {
      const er = wizardError(ui.step, ui.draft);
      if (er) { ui.err = er; render(); break; }
      if (a === "wnext" && ui.step < STEPS - 1) { ui.step++; ui.err = ""; render(); window.scrollTo(0, 0); break; }
      const d = ui.draft; for (const k of ["name","identity","anchor","tinyVersion","fullVersion","place","obstacle","backup"]) d[k] = d[k].trim();
      d.subtasks = d.subtasks.map(s => ({ id: s.id, title: s.title.trim() })).filter(s => s.title);
      const i = data.habits.findIndex(h => h.id === d.id);
      if (i >= 0) data.habits[i] = d; else data.habits.push(d);
      save(); const isNew = ui.isNew; pop();
      if (isNew) toast(`${d.name} added. Do the tiny version today.`);
      break;
    }
    case "edit": case "fix": {
      ui.draft = JSON.parse(JSON.stringify(habit(id))); ui.step = a === "fix" ? +el.dataset.s : 0; ui.isNew = false; push({ r: "edit" }); break;
    }
    case "del": { const h = habit(id); openModal({ title: `Delete ${h.name}?`, body: `<p class="muted">Its whole history will be removed. Graduating keeps the history instead.</p>`, ok: "Delete", danger: true, run: () => { data.habits = data.habits.filter(x => x.id !== h.id); save(); ui.stack = []; } }); break; }
    case "grad": { const h = habit(id); openModal({ title: `Graduate ${h.name}?`, cancel: "Not yet", body: `<p class="muted">It moves to your Hall of Mastery and reminders stop, freeing a slot for a new habit. You can bring it back any time.</p>`, ok: "Graduate", run: () => { h.graduatedDay = t; save(); ui.stack = []; ui.tab = "way"; setTimeout(() => celebrate("Graduated", h.name, "This habit now runs on its own. It lives in your Hall of Mastery."), 50); } }); break; }
    case "restore": { const h = habit(id); h.graduatedDay = null; save(); render(); toast(`${h.name} is back on your Today list.`); break; }
    case "day": { const h = habit(id), d = +el.dataset.d, l = S.level(h, d); setLog(h, d, l === 0 ? 1 : l === 1 && h.fullVersion ? 2 : 0); render(); break; }
    case "strength": { const h = habit(id); openModal({ title: "Weekly strength check", body: strengthBody(), ok: "Save", run: () => {
      const ans = [0, 1, 2, 3].map(i => +document.getElementById("sq" + i).value), sc = S.strengthScore(ans);
      h.strength = h.strength.filter(x => x.day !== t).concat({ day: t, score: sc }); save(); setTimeout(() => toast(`Strength saved: ${sc}/100`), 0);
    } }); break; }
    case "mok": { const r = ui.modal && ui.modal.run; if (r) r(); ui.modal = null; render(); break; }
    case "mclose": ui.modal = null; render(); break;
    case "cclose": clearTimeout(celebTimer); ui.celebrate = null; render(); break;
    case "rsave": {
      const v = k => document.getElementById(k).value.trim();
      data.reviews = [{ day: t, worked: v("rv-w"), blocked: v("rv-b"), change: v("rv-c") }].concat(data.reviews).slice(0, 104);
      data.settings.lastReviewDay = t; save(); pop(); celebrate("Week reviewed", "Nice work", "Small adjustments every week beat big resolutions."); break;
    }
    case "set": data.settings[el.dataset.k] = +el.dataset.v; if (el.dataset.k === "themeMode") applyTheme(); save(); render(); break;
    case "tree": data.settings[el.dataset.k] = el.dataset.k === "treeGoal" ? +el.dataset.v : el.dataset.v; save(); render(); break;
    case "treeprev": ui.treePrev = +el.dataset.v; render(); break;
    case "accent": data.settings.accent = +el.dataset.i; applyTheme(); save(); render(); break;
    case "tog": data.settings[el.dataset.k] = !data.settings[el.dataset.k]; save(); render(); break;
    case "copy": {
      const txt = JSON.stringify(toExport(data), null, 2);
      const fallback = () => { ui.importText = txt; render(); const ta = document.getElementById("s-paste"); ta.focus(); ta.select(); toast("Backup text selected below. Copy it with your keyboard or long-press."); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Backup copied"), fallback); } catch { fallback(); }
      break;
    }
    case "export": (async () => {
      const txt = JSON.stringify(toExport(data), null, 2);
      const dl = window.claude && window.claude.use ? await claude.use("downloads").catch(() => null) : null;
      if (!dl) { toast("Saving files isn't available here. Use Copy backup instead."); return; }
      try { await dl.save({ filename: `enso-habits-backup-${new Date().toISOString().slice(0, 10)}.json`, data: txt }); toast("Backup saved"); }
      catch { toast("Backup not saved."); }
    })(); break;
    case "import": doImport(document.getElementById("s-paste").value); break;
    case "reset": openModal({ title: "Clear all habits?", body: `<p class="muted">This removes every habit, log and review. Save a backup first if you might want them.</p>`, ok: "Clear", danger: true, run: () => { data.habits = []; data.reviews = []; data.tasks = []; data.wins = []; data.focus = null; data.settings.lastReviewDay = null; save(); ui.tab = "today"; } }); break;
    case "wipe": openModal({ title: "Delete my data?", body: `<p class="muted">Every habit, log, review and setting is deleted from ${store.mode === "db" ? "your account and " : ""}this browser. This can't be undone.</p>`, ok: "Delete", danger: true, run: async () => {
      try { localStorage.removeItem(LOCAL_KEY); } catch {}
      if (store.ref) { try { await store.ref.delete(); } catch {} }
      data = { habits: [], settings: defaultSettings(), reviews: [], tasks: [], wins: [], focus: null }; applyTheme(); ui.tab = "today"; ui.stack = []; render(); toast("Your data was deleted");
    } }); break;
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('.habit[role="button"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && (ui.modal || ui.celebrate)) { ui.modal = null; ui.celebrate = null; render(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (ui.draft && route().r === "edit") {
    if (el.dataset.field === "time") { const [h, m] = el.value.split(":").map(Number); if (!isNaN(h)) { ui.draft.reminderHour = h; ui.draft.reminderMinute = m || 0; } }
    else if (el.dataset.field) ui.draft[el.dataset.field] = el.value;
    else if (el.dataset.sub) { const st = ui.draft.subtasks.find(s => s.id === el.dataset.sub); if (st) st.title = el.value; }
    const r = document.getElementById("pv-r"), p = document.getElementById("pv-id");
    if (r) r.textContent = S.recipe(ui.draft);
    if (p) p.textContent = ui.draft.identity ? `I am becoming ${ui.draft.identity}.` : "Your recipe";
    if (ui.err) { ui.err = ""; const er = document.querySelector(".err"); if (er) er.remove(); }
  }
  if (ui.tdraft && route().r === "task" && el.dataset.tfield) {
    const x = ui.tdraft, f = el.dataset.tfield;
    if (f === "time") { const [h, m] = el.value.split(":").map(Number); x.time = isNaN(h) ? -1 : h * 60 + (m || 0); const any = document.querySelector('[data-act="ttime-any"]'); if (any) any.classList.toggle("on", x.time < 0); }
    else x[f] = el.value;
    const pv = document.getElementById("tk-pv"); if (pv) pv.textContent = P.sentence(x);
    const sv = document.getElementById("tk-save"); if (sv) sv.disabled = !x.title.trim();
  }
  if (el.id === "pl-win") ui.win = el.value;
  if (el.id === "s-name") { data.settings.userName = el.value; save(); }
  if (el.id === "s-focus") { data.settings.focusLimit = +el.value; document.getElementById("s-fl").textContent = el.value; save(); }
  if (el.id === "s-paste") ui.importText = el.value;
});
document.addEventListener("change", e => {
  if (e.target.id === "s-file" && e.target.files[0]) { const fr = new FileReader(); fr.onload = () => doImport(String(fr.result)); fr.readAsText(e.target.files[0]); }
});
function doImport(text) {
  try {
    const o = JSON.parse(text);
    if (o.format !== "enso-habits") throw new Error("This is not an Ensō Habits backup file.");
    data = normalize(o); ui.importText = ""; applyTheme(); save(); goTab("today"); toast("Backup restored");
  } catch (err) { toast(err.message && err.message.includes("Ensō") ? err.message : "That text isn't a valid backup. Paste the whole file, starting with {."); }
}

/* ===================== Boot ===================== */
const local = readLocal();
data = local ? normalize(local) : sampleData();
applyTheme();
render();
tick();
connect();
})();
</script>
